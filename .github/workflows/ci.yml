name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Package
        run: ditto -c -k --keepParent TidyMac.app TidyMac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TidyMac
          path: TidyMac.zip
